<section class="login-layout">

    <aside class="brand-panel">
        <div class="brand-lockup">
            <span class="brand-symbol">+</span>
            <span class="brand-name">Galeno<span>SV</span></span>
        </div>
        <p>Gestión clínica</p>
    </aside>

    <section class="form-panel">

        <!-- Inicio de sesión -->
        <div id="login-view" class="form-content">

            <div class="form-heading">
                <span>ACCESO AL SISTEMA</span>
                <h1>Iniciar sesión</h1>
                <p>Selecciona tu clínica, rol y persona.</p>
            </div>

            <form id="login-form">

                <div class="form-field">
                    <label for="clinica">Clínica</label>
                    <input id="clinica" type="text" placeholder="Buscar clínica..." autocomplete="off">
                    <div id="clinica-options" class="suggestions"></div>
                </div>

                <div class="form-field">
                    <label for="rol">Rol</label>
                    <input id="rol" type="text" placeholder="Selecciona una clínica primero" autocomplete="off"
                        disabled>
                    <div id="rol-options" class="suggestions"></div>
                </div>

                <div class="form-field">
                    <label for="persona">Persona</label>
                    <input id="persona" type="text" placeholder="Selecciona un rol primero" autocomplete="off" disabled>
                    <div id="persona-options" class="suggestions"></div>
                </div>

                <p id="feedback" class="feedback" hidden></p>

                <button class="submit-button" type="submit">
                    Iniciar sesión →
                </button>

            </form>

            <p class="form-note">Acceso exclusivo para personal autorizado.</p>
        </div>

        <!-- Sesión activa -->
        <div id="session-view" class="form-content" hidden>

            <div class="form-heading">
                <span>SESIÓN ACTIVA</span>
                <h1>Bienvenido</h1>
                <p>Has iniciado sesión correctamente.</p>
            </div>

            <div class="session-details">
                <div>
                    <span>Persona</span>
                    <strong id="session-persona"></strong>
                </div>

                <div>
                    <span>Rol</span>
                    <strong id="session-rol"></strong>
                </div>

                <div>
                    <span>Clínica</span>
                    <strong id="session-clinica"></strong>
                </div>
            </div>

            <button id="logout-button" class="submit-button">
                Cerrar sesión
            </button>

        </div>

    </section>
</section>
