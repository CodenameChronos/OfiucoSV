<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="./src/manifest.json" />
    <link rel="stylesheet" href="./resources/styles/palette.css" />
    <link rel="stylesheet" href="./resources/styles/components/tokens.css" />
    <link rel="stylesheet" href="./resources/styles/main.css" />
  </head>
  <body>
    <ofiuco-header app-name="OfiucoSV"></ofiuco-header>
    <ofiuco-footer></ofiuco-footer>

    <script
      type="module"
      src="./js/boundary/components/layout/ofiuco-header.js"
    ></script>
    <script
      type="module"
      src="./js/boundary/components/layout/ofiuco-footer.js"
    ></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./serviceWorker.js")
            .then((reg) => console.log("ServiceWorker registrado:", reg.scope))
            .catch((err) =>
              console.error("Error al registrar ServiceWorker:", err),
            );
        });
      }
    </script>
  </body>
</html>
